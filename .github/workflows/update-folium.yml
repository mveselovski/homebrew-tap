name: Update Folium

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-folium

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Point formula and cask at the latest release
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/update-folium.sh

      - name: Commit
        if: steps.update.outputs.message != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "${{ steps.update.outputs.message }}"
          git push
